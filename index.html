<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fuckin.js (.fjs)</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; text-align: center; }
        textarea { width: 90%; height: 120px; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 4px; padding: 10px; margin: 10px 0; font-family: monospace; resize: vertical; }
        button { padding: 8px 15px; background: #238636; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        #status { margin-top: 15px; color: #8b949e; font-family: monospace; }
        #author { margin-top: 15px; color: #8b949e; font-family: monospace; }
    </style>
</head>
<body>

    <h2>fuckin.js (.fjs)</h2>
    
    <div>visible javascript input</div>
    <textarea id="input" placeholder="alert('hello');"></textarea>
    
    <button onclick="runcompile()">make invisible</button>
    <button onclick="copycode()">copy output</button>
    <button onclick="downloadfjs()">download .fjs file</button>
    
    <div>invisible output (looks empty but contains code)</div>
    <textarea id="output" placeholder="invisible text will appear here"></textarea>
    
    <div id="status">ready</div>
    <br>
    <div id="author"><a href="http://codedroider.github.io">author</a></div>

    <script src="fuckin.js"></script>
    <script>
        function runcompile() {
            const input = document.getElementById('input').value;
            const out = document.getElementById('output');
            const status = document.getElementById('status');
            
            if (!input.trim()) {
                status.innerText = 'input is empty';
                return;
            }
            
            const result = fuckinjs.compile(input);
            out.value = result;
            status.innerText = `done: code hidden in ${result.length} invisible symbols (${(result.length * 2 / 1024).toFixed(2)} kb)`;
        }

        function copycode() {
            const out = document.getElementById('output');
            const status = document.getElementById('status');
            if (!out.value) {
                status.innerText = 'nothing to copy';
                return;
            }
            out.select();
            out.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(out.value);
            status.innerText = 'copied to clipboard';
        }

        function downloadfjs() {
            const out = document.getElementById('output').value;
            const status = document.getElementById('status');
            if (!out) {
                status.innerText = 'nothing to download';
                return;
            }
            const randomStr = Math.random().toString(36).substring(2);
            const blob = new Blob([out], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${randomStr}.fjs`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            status.innerText = 'downloaded';
        }
    </script>

</body>
</html>
